<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Test Video 360° – Caballo</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: grab;
      }
      body:active {
        cursor: grabbing;
      }

      #application-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.9);
        color: #fff;
        font-family: system-ui, sans-serif;
        z-index: 10;
        transition: opacity 0.6s ease;
      }
      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #overlay p {
        font-size: 1rem;
        opacity: 0.7;
        margin-top: 0.5rem;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #hint {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.6);
        font-family: system-ui, sans-serif;
        font-size: 0.85rem;
        pointer-events: none;
        transition: opacity 1s ease;
        white-space: nowrap;
      }
      #hint.hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <div class="spinner"></div>
      <span>Cargando video 360°…</span>
      <p>moto.mp4</p>
    </div>

    <p id="hint">Arrastrá para mirar alrededor</p>

    <canvas id="application-canvas"></canvas>

    <!-- PlayCanvas UMD engine -->
    <script src="https://cdn.jsdelivr.net/npm/playcanvas@2.21.4/build/playcanvas.js"></script>

    <script>
      ;(function () {
        'use strict'

        const canvas = document.getElementById('application-canvas')
        const overlay = document.getElementById('overlay')
        const hint = document.getElementById('hint')

        // ── PlayCanvas app ────────────────────────────────────────────────────
        const app = new pc.Application(canvas, {
          mouse: new pc.Mouse(document.body),
          touch: new pc.TouchDevice(document.body)
        })

        app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW)
        app.setCanvasResolution(pc.RESOLUTION_AUTO)
        window.addEventListener('resize', () => app.resizeCanvas())

        // ── Video texture ─────────────────────────────────────────────────────
        const videoTexture = new pc.Texture(app.graphicsDevice, {
          format: pc.PIXELFORMAT_RGBA8,
          mipmaps: false,
          minFilter: pc.FILTER_LINEAR,
          magFilter: pc.FILTER_LINEAR,
          addressU: pc.ADDRESS_CLAMP_TO_EDGE,
          addressV: pc.ADDRESS_CLAMP_TO_EDGE
        })

        const video = document.createElement('video')
        video.loop = true
        video.muted = true
        video.autoplay = true
        video.playsInline = true
        video.crossOrigin = 'anonymous'
        // Keep tiny & hidden so mobile browsers will load it
        Object.assign(video.style, {
          display: 'block',
          width: '1px',
          height: '1px',
          position: 'absolute',
          opacity: '0',
          zIndex: '-1000',
          top: '0',
          pointerEvents: 'none'
        })
        video.src = 'caballo.mp4'
        document.body.appendChild(video)

        video.addEventListener('loadedmetadata', () => {
          videoTexture.resize(video.videoWidth, video.videoHeight)
        })

        video.addEventListener('canplaythrough', () => {
          videoTexture.setSource(video)
          video.play().catch(() => {})

          overlay.classList.add('hidden')

          // Auto-hide the drag hint after 4 s
          setTimeout(() => hint.classList.add('hidden'), 4000)
        })

        // ── Camera (at origin, inside the sphere) ─────────────────────────────
        const camera = new pc.Entity('camera')
        camera.addComponent('camera', {
          clearColor: new pc.Color(0, 0, 0),
          nearClip: 0.5,
          farClip: 2000
        })
        app.root.addChild(camera)

        // ── 360 sphere ────────────────────────────────────────────────────────
        const sphere = new pc.Entity('sphere360')
        sphere.addComponent('render', { type: 'sphere' })
        sphere.setLocalScale(1000, 1000, 1000)

        const mat = new pc.StandardMaterial()
        mat.emissiveMap = videoTexture
        mat.emissive = pc.Color.WHITE
        mat.useLighting = false
        mat.cull = pc.CULLFACE_FRONT // render inner surface
        // Mirror U to correct the left-right flip when viewing from inside
        mat.emissiveMapTiling = new pc.Vec2(-1, 1)
        mat.emissiveMapOffset = new pc.Vec2(1, 0)
        mat.update()

        sphere.render.meshInstances[0].material = mat
        app.root.addChild(sphere)

        // ── Look-around controls ──────────────────────────────────────────────
        let yaw = 0
        let pitch = 0
        const SENS = 0.25

        // Mouse
        let dragging = false,
          lastX = 0,
          lastY = 0

        canvas.addEventListener('mousedown', e => {
          dragging = true
          lastX = e.clientX
          lastY = e.clientY
        })
        window.addEventListener('mouseup', () => {
          dragging = false
        })
        window.addEventListener('mousemove', e => {
          if (!dragging) return
          yaw -= (e.clientX - lastX) * SENS
          pitch -= (e.clientY - lastY) * SENS
          pitch = Math.max(-89, Math.min(89, pitch))
          lastX = e.clientX
          lastY = e.clientY
        })

        // Touch
        let lastTX = 0,
          lastTY = 0
        canvas.addEventListener(
          'touchstart',
          e => {
            lastTX = e.touches[0].clientX
            lastTY = e.touches[0].clientY
          },
          { passive: true }
        )
        canvas.addEventListener(
          'touchmove',
          e => {
            e.preventDefault()
            yaw -= (e.touches[0].clientX - lastTX) * SENS
            pitch -= (e.touches[0].clientY - lastTY) * SENS
            pitch = Math.max(-89, Math.min(89, pitch))
            lastTX = e.touches[0].clientX
            lastTY = e.touches[0].clientY
          },
          { passive: false }
        )

        // ── Main loop ─────────────────────────────────────────────────────────
        app.start()
        video.load()

        let uploadToggle = false
        app.on('update', () => {
          camera.setEulerAngles(pitch, yaw, 0)

          // Upload video frame every other tick to reduce GPU pressure
          uploadToggle = !uploadToggle
          if (uploadToggle) videoTexture.upload()
        })
      })()
    </script>
  </body>
</html>
