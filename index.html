<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Video 360°</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: grab;
      }
      body:active {
        cursor: grabbing;
      }

      #application-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.9);
        color: #fff;
        font-family: system-ui, sans-serif;
        z-index: 10;
        transition: opacity 0.6s ease;
      }
      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #overlay p {
        font-size: 1rem;
        opacity: 0.7;
        margin-top: 0.5rem;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #hint {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.6);
        font-family: system-ui, sans-serif;
        font-size: 0.85rem;
        pointer-events: none;
        transition: opacity 1s ease;
        white-space: nowrap;
      }
      #hint.hidden {
        opacity: 0;
      }

      #webm-overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 6;
        pointer-events: none;
        display: none;
      }

      #btn-start {
        display: none;
        margin-top: 2rem;
        padding: 0.8rem 2.5rem;
        font-size: 1.1rem;
        font-family: system-ui, sans-serif;
        font-weight: 600;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 2rem;
        cursor: pointer;
        letter-spacing: 0.03em;
      }
      #btn-start:active {
        opacity: 0.8;
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .register('/sw.js')
          .catch(err => console.warn('SW no registrado:', err))
      }
    </script>
  </head>
  <body>
    <div id="overlay">
      <div class="spinner"></div>
      <span>Cargando video 360°…</span>
      <button id="btn-start">▶ Comenzar</button>
    </div>

    <p id="hint">Arrastrá para mirar alrededor</p>

    <canvas id="application-canvas"></canvas>

    <!-- Socket.IO cliente (sync entre visores) -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <!-- Hydra synth -->
    <script src="https://unpkg.com/hydra-synth/dist/hydra-synth.js"></script>

    <!-- PlayCanvas UMD engine -->
    <script src="https://cdn.jsdelivr.net/npm/playcanvas@2.21.4/build/playcanvas.js"></script>

    <script>
      ;(function () {
        'use strict'

        const canvas = document.getElementById('application-canvas')
        const overlay = document.getElementById('overlay')
        const hint = document.getElementById('hint')

        // ── PlayCanvas app ────────────────────────────────────────────────────
        const app = new pc.Application(canvas, {
          mouse: new pc.Mouse(document.body),
          touch: new pc.TouchDevice(document.body),
          graphicsDeviceOptions: { alpha: true }
        })
        app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW)
        app.setCanvasResolution(pc.RESOLUTION_AUTO)
        window.addEventListener('resize', () => app.resizeCanvas())

        // ── Camera ───────────────────────────────────────────────────────────
        const camera = new pc.Entity('camera')
        camera.addComponent('camera', {
          clearColor: new pc.Color(0, 0, 0),
          nearClip: 0.5,
          farClip: 2000
        })
        app.root.addChild(camera)

        // ── Hydra sphere (background, siempre visible) ────────────────────────
        const hydraCanvas = document.createElement('canvas')
        hydraCanvas.width = 512
        hydraCanvas.height = 512
        Object.assign(hydraCanvas.style, {
          display: 'none',
          position: 'absolute'
        })
        document.body.appendChild(hydraCanvas)

        let hydraTexture = null
        let hydraSphere = null
        let hydraObj = null
        try {
          hydraObj = new Hydra({
            canvas: hydraCanvas,
            autoLoop: false,
            detectAudio: false
          })
          osc(10, 0.1, 0.5)
            .mult(osc(10, 0.1, 0.5).rotate(Math.PI / 2))
            .modulate(noise(0.25))
            //.blend(src(o0), 0.8)
            //.modulate(src(o0), 0.1)
            .out()

          hydraTexture = new pc.Texture(app.graphicsDevice, {
            format: pc.PIXELFORMAT_RGB8,
            mipmaps: false,
            minFilter: pc.FILTER_LINEAR,
            magFilter: pc.FILTER_LINEAR,
            addressU: pc.ADDRESS_CLAMP_TO_EDGE,
            addressV: pc.ADDRESS_CLAMP_TO_EDGE
          })
          hydraTexture.setSource(hydraCanvas)

          hydraSphere = new pc.Entity('hydraSphere')
          hydraSphere.addComponent('render', { type: 'sphere' })
          hydraSphere.setLocalScale(1000, 1000, 1000)

          const hydraMat = new pc.StandardMaterial()
          hydraMat.emissiveMap = hydraTexture
          hydraMat.emissive = pc.Color.WHITE
          hydraMat.useLighting = false
          hydraMat.cull = pc.CULLFACE_FRONT
          hydraMat.update()

          hydraSphere.render.meshInstances[0].material = hydraMat
          app.root.addChild(hydraSphere)
        } catch (e) {
          console.warn('Hydra no disponible:', e)
        }

        // ── Video texture (video_noBg.webm con canal alfa) ─────────────────────
        const videoTexture = new pc.Texture(app.graphicsDevice, {
          format: pc.PIXELFORMAT_RGBA8,
          mipmaps: false,
          minFilter: pc.FILTER_LINEAR,
          magFilter: pc.FILTER_LINEAR,
          addressU: pc.ADDRESS_CLAMP_TO_EDGE,
          addressV: pc.ADDRESS_CLAMP_TO_EDGE
        })

        const video = document.createElement('video')
        video.loop = false
        video.muted = true
        video.autoplay = false
        video.preload = 'auto'
        video.playsInline = true
        video.crossOrigin = 'anonymous'
        Object.assign(video.style, {
          display: 'block',
          width: '1px',
          height: '1px',
          position: 'absolute',
          opacity: '0',
          zIndex: '-1000',
          top: '0',
          pointerEvents: 'none'
        })
        video.src = '/video_noBg.webm'
        document.body.appendChild(video)

        // ── Video sphere (primer plano transparente, sobre Hydra) ─────────────
        const videoSphere = new pc.Entity('videoSphere')
        videoSphere.addComponent('render', { type: 'sphere' })
        videoSphere.setLocalScale(999, 999, 999)
        videoSphere.setEulerAngles(0, 180, 0)

        const videoMat = new pc.StandardMaterial()
        videoMat.emissiveMap = videoTexture
        videoMat.emissive = pc.Color.WHITE
        videoMat.opacityMap = videoTexture
        videoMat.opacityMapChannel = 'a'
        videoMat.blendType = pc.BLEND_NORMAL
        videoMat.depthWrite = false
        videoMat.useLighting = false
        videoMat.cull = pc.CULLFACE_FRONT
        videoMat.emissiveMapTiling = new pc.Vec2(-1, 1)
        videoMat.emissiveMapOffset = new pc.Vec2(1, 0)
        videoMat.opacityMapTiling = new pc.Vec2(-1, 1)
        videoMat.opacityMapOffset = new pc.Vec2(1, 0)
        videoMat.update()

        videoSphere.render.meshInstances[0].material = videoMat
        videoSphere.enabled = false // oculto hasta que llegue 'go'
        app.root.addChild(videoSphere)

        // ── Sync entre visores ────────────────────────────────────────────────
        const SYNC_SERVER_URL =
          'https://earthquake-organization-prices-common.trycloudflare.com' // Cambiar la url segun el del servidor

        let syncStartAt = null
        const socket = io(SYNC_SERVER_URL, {
          timeout: 4000,
          extraHeaders: { 'ngrok-skip-browser-warning': 'true' }
        })

        socket.on('connect', () => socket.emit('register', 'headset'))
        socket.on('connect_error', () => {
          console.warn(
            'No se pudo conectar al servidor de sync. Revisá SYNC_SERVER_URL.'
          )
        })

        function resetScene() {
          video.pause()
          video.currentTime = 0
          videoSphere.enabled = false
          if (hydraSphere) hydraSphere.enabled = true
          camera.camera.clearColor = new pc.Color(0, 0, 0)
        }

        // El servidor envía la hora de inicio del video
        socket.on('go', ({ startAt }) => {
          syncStartAt = startAt
          videoSphere.enabled = true
          const delay = Math.max(0, startAt - Date.now())
          setTimeout(() => video.play().catch(() => {}), delay)
        })

        // Si un visor se conecta después de que ya arrancó, se pone al día
        socket.on('catchup', ({ startAt }) => {
          syncStartAt = startAt
          videoSphere.enabled = true
          const expected = Math.max(0, (Date.now() - startAt) / 1000)
          video.currentTime = expected
          video.play().catch(() => {})
        })

        socket.on('reset-ack', () => {
          resetScene()
          syncStartAt = null
        })

        video.addEventListener('timeupdate', () => {
          if (syncStartAt === null || video.paused) return
          const expected = (Date.now() - syncStartAt) / 1000
          if (Math.abs(video.currentTime - expected) > 0.15) {
            video.currentTime = expected
          }
        })

        video.addEventListener('playing', () => {
          overlay.classList.add('hidden')
          setTimeout(() => hint.classList.add('hidden'), 4000)
        })

        video.addEventListener('loadedmetadata', () => {
          videoTexture.resize(video.videoWidth, video.videoHeight)
          videoTexture.setSource(video)
          overlay.querySelector('.spinner').style.display = 'none'
          document.getElementById('btn-start').style.display = 'block'
        })

        video.addEventListener('error', () => {
          overlay.querySelector('span').textContent = 'Error al cargar el video'
          overlay.querySelector('.spinner').style.display = 'none'
        })

        // ── Video terminado → passthrough del casco ───────────────────────────
        video.addEventListener('ended', () => {
          videoSphere.enabled = false
          activateHelmetCameras()
        })

        function activateHelmetCameras() {
          if (hydraSphere) hydraSphere.enabled = false
          camera.camera.clearColor = new pc.Color(0, 0, 0, 0)
        }

        // ── Botón Comenzar → fullscreen / WebXR ──────────────────────────────
        document.getElementById('btn-start').addEventListener('click', () => {
          overlay.querySelector('span').textContent =
            'Listo — esperando inicio...'
          overlay.querySelector('.spinner').style.display = 'block'
          document.getElementById('btn-start').style.display = 'none'

          const fallbackFullscreen = () => {
            const fsEl = document.documentElement
            const fsReq =
              fsEl.requestFullscreen ||
              fsEl.webkitRequestFullscreen ||
              fsEl.mozRequestFullScreen
            if (fsReq) fsReq.call(fsEl).catch(() => {})
          }

          if (navigator.xr && app.xr.isAvailable(pc.XRTYPE_AR)) {
            app.xr.start(camera.camera, pc.XRTYPE_AR, pc.XRSPACE_LOCALFLOOR, {
              callback: err => {
                if (err) fallbackFullscreen()
              }
            })
          } else if (navigator.xr && app.xr.isAvailable(pc.XRTYPE_VR)) {
            app.xr.start(camera.camera, pc.XRTYPE_VR, pc.XRSPACE_LOCAL, {
              callback: err => {
                if (err) fallbackFullscreen()
              }
            })
          } else {
            fallbackFullscreen()
          }

          if (socket.connected) {
            socket.emit('ready')
          } else {
            setTimeout(() => {
              if (video.paused) {
                videoSphere.enabled = true
                video.play().catch(() => {})
              }
            }, 1000)
          }
        })

        // ── Look-around controls ──────────────────────────────────────────────
        let yaw = 0
        let pitch = 0
        const SENS = 0.25
        let dragging = false,
          lastX = 0,
          lastY = 0

        canvas.addEventListener('mousedown', e => {
          dragging = true
          lastX = e.clientX
          lastY = e.clientY
        })
        window.addEventListener('mouseup', () => {
          dragging = false
        })
        window.addEventListener('mousemove', e => {
          if (!dragging) return
          yaw -= (e.clientX - lastX) * SENS
          pitch -= (e.clientY - lastY) * SENS
          pitch = Math.max(-89, Math.min(89, pitch))
          lastX = e.clientX
          lastY = e.clientY
        })

        let lastTX = 0,
          lastTY = 0
        canvas.addEventListener(
          'touchstart',
          e => {
            lastTX = e.touches[0].clientX
            lastTY = e.touches[0].clientY
          },
          { passive: true }
        )
        canvas.addEventListener(
          'touchmove',
          e => {
            e.preventDefault()
            yaw -= (e.touches[0].clientX - lastTX) * SENS
            pitch -= (e.touches[0].clientY - lastTY) * SENS
            pitch = Math.max(-89, Math.min(89, pitch))
            lastTX = e.touches[0].clientX
            lastTY = e.touches[0].clientY
          },
          { passive: false }
        )

        // ── Main loop ─────────────────────────────────────────────────────────
        app.start()
        video.load()

        let uploadToggle = false
        app.on('update', dt => {
          if (!app.xr.active) {
            camera.setEulerAngles(pitch, yaw, 0)
          }
          // Tick manual de Hydra (evita conflicto de contextos WebGL en Quest 2)
          if (hydraObj) hydraObj.synth.tick(performance.now())

          uploadToggle = !uploadToggle
          if (uploadToggle) {
            if (videoSphere.enabled && video.readyState >= 2)
              videoTexture.upload()
            if (hydraTexture) hydraTexture.upload()
          }
        })
      })()
    </script>
  </body>
</html>
