<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Video 360°</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: grab;
      }
      body:active {
        cursor: grabbing;
      }

      #application-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.9);
        color: #fff;
        font-family: system-ui, sans-serif;
        z-index: 10;
        transition: opacity 0.6s ease;
      }
      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #overlay p {
        font-size: 1rem;
        opacity: 0.7;
        margin-top: 0.5rem;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #hint {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.6);
        font-family: system-ui, sans-serif;
        font-size: 0.85rem;
        pointer-events: none;
        transition: opacity 1s ease;
        white-space: nowrap;
      }
      #hint.hidden {
        opacity: 0;
      }

      #webm-overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 6;
        pointer-events: none;
        display: none;
      }

      #btn-start {
        display: none;
        margin-top: 2rem;
        padding: 0.8rem 2.5rem;
        font-size: 1.1rem;
        font-family: system-ui, sans-serif;
        font-weight: 600;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 2rem;
        cursor: pointer;
        letter-spacing: 0.03em;
      }
      #btn-start:active {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <div class="spinner"></div>
      <span>Cargando video 360°…</span>
      <button id="btn-start">▶ Comenzar</button>
    </div>

    <p id="hint">Arrastrá para mirar alrededor</p>

    <video
      id="webm-overlay"
      src="/test_transparente.webm"
      muted
      playsinline
      preload="auto"
    ></video>

    <canvas id="application-canvas"></canvas>

    <!-- Socket.IO cliente (sync entre visores) -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <!-- PlayCanvas UMD engine -->
    <script src="https://cdn.jsdelivr.net/npm/playcanvas@2.21.4/build/playcanvas.js"></script>

    <script>
      ;(function () {
        'use strict'

        const canvas = document.getElementById('application-canvas')
        const overlay = document.getElementById('overlay')
        const hint = document.getElementById('hint')

        // ── PlayCanvas app ────────────────────────────────────────────────────
        const app = new pc.Application(canvas, {
          mouse: new pc.Mouse(document.body),
          touch: new pc.TouchDevice(document.body),

          graphicsDeviceOptions: {
            alpha: true
          }
        })

        app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW)
        app.setCanvasResolution(pc.RESOLUTION_AUTO)
        window.addEventListener('resize', () => app.resizeCanvas())

        // ── Video texture ─────────────────────────────────────────────────────
        const videoTexture = new pc.Texture(app.graphicsDevice, {
          format: pc.PIXELFORMAT_RGBA8,
          mipmaps: false,
          minFilter: pc.FILTER_LINEAR,
          magFilter: pc.FILTER_LINEAR,
          addressU: pc.ADDRESS_CLAMP_TO_EDGE,
          addressV: pc.ADDRESS_CLAMP_TO_EDGE
        })

        const video = document.createElement('video')
        video.loop = false
        video.muted = true
        video.autoplay = false
        video.preload = 'auto'
        video.playsInline = true
        video.crossOrigin = 'anonymous'
        // Keep tiny & hidden so mobile browsers will load it
        Object.assign(video.style, {
          display: 'block',
          width: '1px',
          height: '1px',
          position: 'absolute',
          opacity: '0',
          zIndex: '-1000',
          top: '0',
          pointerEvents: 'none'
        })
        //video.src = 'https://static.flok.cc/prueba_web.mp4'
        video.src = '/BAILE_1_optimizado.mp4'
        document.body.appendChild(video)

        // ── Sync entre visores ────────────────────────────────────────────────
        const SYNC_SERVER_URL =
          'https://things-andrea-creation-essays.trycloudflare.com' // Cambiar la url segun el del servidosr

        let syncStartAt = null
        const socket = io(SYNC_SERVER_URL, {
          timeout: 4000,
          extraHeaders: {
            'ngrok-skip-browser-warning': 'true'
          }
        })

        socket.on('connect', () => {
          socket.emit('register', 'headset')
        })

        socket.on('connect_error', () => {
          console.warn(
            'No se pudo conectar al servidor de sync. Revisá SYNC_SERVER_URL.'
          )
        })

        // reiniciar la sesion al estado inicial, para poder volver a reproducir el video
        function resetScene() {
          video.pause()
          video.currentTime = 0
          webmOverlay.pause()
          webmOverlay.currentTime = 0
          webmOverlay.style.display = 'none'
          sphere.enabled = true
          if (hydraSphere) hydraSphere.enabled = true
          camera.camera.clearColor = new pc.Color(0, 0, 0)
          vibIdx = 0
        }

        // El servidor envía la hora de inicio del video
        socket.on('go', ({ startAt }) => {
          syncStartAt = startAt
          const delay = Math.max(0, startAt - Date.now())
          setTimeout(() => {
            video.play().catch(() => {})
          }, delay)
        })

        // Si un visor se conecta después de que ya arrancó, el servidor le manda la posición actual para ponerse al día
        socket.on('catchup', ({ startAt }) => {
          syncStartAt = startAt
          const expected = Math.max(0, (Date.now() - startAt) / 1000)
          video.currentTime = expected
          video.play().catch(() => {})
        })

        // reiniciar la sesion a todos los visores
        socket.on('reset-ack', () => {
          resetScene()
          syncStartAt = null
        })

        // Cada vez que el video avanza, se ajusta la posición si hay desincronización
        video.addEventListener('timeupdate', () => {
          if (syncStartAt === null || video.paused) return
          const expected = (Date.now() - syncStartAt) / 1000
          if (Math.abs(video.currentTime - expected) > 0.15) {
            video.currentTime = expected
          }
        })

        // Recién cuando el video empieza a reproducirse de verdad (ya sincronizado) se oculta el overlay de carga.
        video.addEventListener('playing', () => {
          overlay.classList.add('hidden')
          setTimeout(() => hint.classList.add('hidden'), 4000)
        })

        video.addEventListener('loadedmetadata', () => {
          videoTexture.resize(video.videoWidth, video.videoHeight)
          videoTexture.setSource(video)
          // Mostrar botón en cuanto hay metadata – no esperar buffer completo
          overlay.querySelector('.spinner').style.display = 'none'
          document.getElementById('btn-start').style.display = 'block'
        })

        video.addEventListener('error', () => {
          overlay.querySelector('span').textContent = 'Error al cargar el video'
          overlay.querySelector('.spinner').style.display = 'none'
        })

        document.getElementById('btn-start').addEventListener('click', () => {
          /* video.play().catch(() => {})
          overlay.classList.add('hidden')
          setTimeout(() => hint.classList.add('hidden'), 4000) */
          overlay.querySelector('span').textContent =
            'Listo — esperando inicio...'
          overlay.querySelector('.spinner').style.display = 'block'
          document.getElementById('btn-start').style.display = 'none'

          const fallbackFullscreen = () => {
            const fsEl = document.documentElement
            const fsReq =
              fsEl.requestFullscreen ||
              fsEl.webkitRequestFullscreen ||
              fsEl.mozRequestFullScreen
            if (fsReq) fsReq.call(fsEl).catch(() => {})
          }

          if (navigator.xr && app.xr.isAvailable(pc.XRTYPE_AR)) {
            app.xr.start(camera.camera, pc.XRTYPE_AR, pc.XRSPACE_LOCALFLOOR, {
              callback: err => {
                if (err) fallbackFullscreen()
              }
            })
          } else if (navigator.xr && app.xr.isAvailable(pc.XRTYPE_VR)) {
            app.xr.start(camera.camera, pc.XRTYPE_VR, pc.XRSPACE_LOCAL, {
              callback: err => {
                if (err) fallbackFullscreen()
              }
            })
          } else {
            fallbackFullscreen()
          }

          if (socket.connected) {
            socket.emit('ready')
          } else {
            setTimeout(() => {
              if (video.paused) video.play().catch(() => {})
            }, 1000)
          }
        })

        // ── Vibración durante prueba_web.mp4 ─────────────────────────────────
        // Cues en segundos – ajustá los tiempos según la duración real del video
        /* const VIB_CUES = [
          { t: 3, p: [200] },
          { t: 8, p: [300, 150, 300] },
          { t: 14, p: [500] },
          { t: 20, p: [200, 100, 200, 100, 400] },
          { t: 27, p: [800] }
        ]
        let vibIdx = 0
        video.addEventListener('timeupdate', () => {
          while (
            vibIdx < VIB_CUES.length &&
            video.currentTime >= VIB_CUES[vibIdx].t
          ) {
            if (navigator.vibrate) navigator.vibrate(VIB_CUES[vibIdx].p)
            vibIdx++
          }
        }) */

        // ── Secuencia: video termina → webm → cámaras del casco ──────────────
        const webmOverlay = document.getElementById('webm-overlay')

        video.addEventListener('ended', () => {
          sphere.enabled = false
          webmOverlay.style.display = 'block'
          webmOverlay.play().catch(() => {})
        })

        webmOverlay.addEventListener('ended', () => {
          webmOverlay.style.display = 'none'
          activateHelmetCameras()
        })

        // ── Passthrough ────────────────────────────────────────────────────────
        function activateHelmetCameras() {
          camera.camera.clearColor = new pc.Color(0, 0, 0, 0)
        }

        // ── Camera (at origin, inside the sphere) ─────────────────────────────
        const camera = new pc.Entity('camera')
        camera.addComponent('camera', {
          clearColor: new pc.Color(0, 0, 0),
          nearClip: 0.5,
          farClip: 2000
        })
        app.root.addChild(camera)

        // ── 360 sphere ────────────────────────────────────────────────────────
        const sphere = new pc.Entity('sphere360')
        sphere.addComponent('render', { type: 'sphere' })
        sphere.setLocalScale(1000, 1000, 1000)
        sphere.setEulerAngles(0, 180, 0) // orient the sphere so the video is right-side up

        const mat = new pc.StandardMaterial()
        mat.emissiveMap = videoTexture
        mat.emissive = pc.Color.WHITE
        mat.useLighting = false
        mat.cull = pc.CULLFACE_FRONT // render inner surface
        // Mirror U to correct the left-right flip when viewing from inside
        mat.emissiveMapTiling = new pc.Vec2(-1, 1)
        mat.emissiveMapOffset = new pc.Vec2(1, 0)
        mat.update()

        sphere.render.meshInstances[0].material = mat
        app.root.addChild(sphere)

        // ── Look-around controls ──────────────────────────────────────────────
        let yaw = 0
        let pitch = 0
        const SENS = 0.25

        // Mouse
        let dragging = false,
          lastX = 0,
          lastY = 0

        canvas.addEventListener('mousedown', e => {
          dragging = true
          lastX = e.clientX
          lastY = e.clientY
        })
        window.addEventListener('mouseup', () => {
          dragging = false
        })
        window.addEventListener('mousemove', e => {
          if (!dragging) return
          yaw -= (e.clientX - lastX) * SENS
          pitch -= (e.clientY - lastY) * SENS
          pitch = Math.max(-89, Math.min(89, pitch))
          lastX = e.clientX
          lastY = e.clientY
        })

        // Touch
        let lastTX = 0,
          lastTY = 0
        canvas.addEventListener(
          'touchstart',
          e => {
            lastTX = e.touches[0].clientX
            lastTY = e.touches[0].clientY
          },
          { passive: true }
        )
        canvas.addEventListener(
          'touchmove',
          e => {
            e.preventDefault()
            yaw -= (e.touches[0].clientX - lastTX) * SENS
            pitch -= (e.touches[0].clientY - lastTY) * SENS
            pitch = Math.max(-89, Math.min(89, pitch))
            lastTX = e.touches[0].clientX
            lastTY = e.touches[0].clientY
          },
          { passive: false }
        )

        // ── Main loop ─────────────────────────────────────────────────────────
        app.start()
        video.load()

        let uploadToggle = false
        app.on('update', dt => {
          // En WebXR el headset controla la cámara; solo aplicar rotación manual fuera de XR
          if (!app.xr.active) {
            camera.setEulerAngles(pitch, yaw, 0)
          }

          // Upload textures every other tick
          uploadToggle = !uploadToggle
          if (uploadToggle) {
            if (sphere.enabled) videoTexture.upload()
          }
        })
      })()
    </script>
  </body>
</html>
